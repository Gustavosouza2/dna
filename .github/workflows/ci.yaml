name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time only (metadataBase/sitemap/robots). Any valid absolute
      # URL works for CI — the real one is set on the deploy server.
      NEXT_PUBLIC_SITE_URL: https://www.dnaircargo.com.br
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
